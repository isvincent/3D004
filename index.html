<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨越畫框的古石橋 — 3D 互動場景</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
        }
        
        .serif-title {
            font-family: 'Noto Serif TC', serif;
        }

        /* 玻璃擬態面板 */
        .glass-panel {
            background: rgba(20, 18, 16, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.28);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .gold-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-btn:hover {
            background: rgba(212, 175, 55, 0.22);
            border-color: rgba(212, 175, 55, 0.7);
            transform: translateY(-1px);
        }
        .gold-btn.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.45), rgba(160, 115, 25, 0.45));
            border-color: #eab308;
            color: #fef08a;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* 3D 熱點標記 */
        .hotspot-marker {
            position: absolute;
            width: 28px;
            height: 28px;
            margin-left: -14px;
            margin-top: -14px;
            border-radius: 50%;
            background: rgba(20, 18, 15, 0.85);
            border: 2px solid #f59e0b;
            color: #fde047;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
            z-index: 10;
        }
        .hotspot-marker::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1.5px solid #f59e0b;
            animation: pulse-ring 2s infinite;
        }
        .hotspot-marker:hover {
            transform: scale(1.25);
            background: #f59e0b;
            color: #111;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.9);
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.4); border-radius: 4px; }
    </style>
</head>
<body class="text-stone-100">

    <!-- 3D 畫布容器 -->
    <div id="canvas-container" class="w-screen h-screen relative"></div>

    <!-- 3D 導覽熱點圖層 -->
    <div id="hotspots-layer" class="fixed inset-0 pointer-events-none overflow-hidden z-10"></div>

    <!-- 左上標題與操作提示 -->
    <div class="fixed top-4 left-4 z-20 pointer-events-none flex flex-col gap-2 max-w-md">
        <div class="glass-panel px-5 py-3.5 rounded-2xl pointer-events-auto">
            <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>

            </div>
            <h1 class="serif-title text-xl md:text-2xl font-bold text-amber-50 mt-0.5 tracking-wide">跨越畫框的古石橋</h1>
            <p class="text-xs text-stone-300/90 mt-1 leading-relaxed">
                拖曳滑鼠可 360° 旋轉視角、滾輪縮放、右鍵平移。點擊場景中的發光標記或直接點擊 3D 物件可檢視藝術細節。
            </p>

    <!-- 右上控制面板收合按鈕 (手機與桌面通用) -->

        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
        </svg>
        <span id="toggle-ui-text">收合控制面板</span>
    </button>

    <!-- 右側互動控制面板 -->
    <aside id="control-panel" class="fixed top-16 right-4 z-20 w-72 md:w-80 glass-panel rounded-2xl p-4 flex flex-col gap-4 max-h-[calc(100vh-5.5rem)] overflow-y-auto transition-all duration-300">
        
        <!-- 1. 視角快速切換 -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-amber-300 flex items-center gap-1.5">
                    <span>🎥</span> 鏡頭視角切換

                    <span>🖼️</span> 經典相片視角

                <button data-cam="bridge" class="cam-btn gold-btn px-3 py-2 rounded-xl text-xs font-medium text-left flex items-center gap-2">
                    <span>🌉</span> 漫步古橋視角
                </button>
                <button data-cam="painting" class="cam-btn gold-btn px-3 py-2 rounded-xl text-xs font-medium text-left flex items-center gap-2">
                    <span>🏔️</span> 畫中世界視角
                </button>
                <button data-cam="room" class="cam-btn gold-btn px-3 py-2 rounded-xl text-xs font-medium text-left flex items-center gap-2">
                    <span>🛋️</span> 客廳全景視角
                </button>
            </div>
        </div>

        <hr class="border-stone-700/60">

        <!-- 2. 日夜與光影氛圍 -->
        <div>
            <h2 class="text-xs font-semibold uppercase tracking-wider text-amber-300 mb-2 flex items-center gap-1.5">
                <span>🌅</span> 光影與時辰模式
            </h2>
            <div class="grid grid-cols-3 gap-1.5">
                <button data-light="sunset" class="light-btn gold-btn active py-2 px-2 rounded-xl text-xs font-medium text-center">
                    黃昏暖陽
                </button>
                <button data-light="night" class="light-btn gold-btn py-2 px-2 rounded-xl text-xs font-medium text-center">

                </button>
                <button data-light="morning" class="light-btn gold-btn py-2 px-2 rounded-xl text-xs font-medium text-center">
                    晨曦微光
                </button>
            </div>
        </div>

        <hr class="border-stone-700/60">

        <!-- 3. 動態與環境特效開關 -->
        <div class="flex flex-col gap-2.5">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-amber-300 flex items-center gap-1.5">
                <span>✨</span> 場景動態與細節控制
            </h2>

            <!-- 橋上旅人與雲霧動畫 -->
            <label class="flex items-center justify-between cursor-pointer text-xs py-1">
                <span class="text-stone-200 flex items-center gap-2">🚶 橋上旅人與山谷雲霧</span>
                <input type="checkbox" id="toggle-anim" checked class="accent-amber-500 w-4 h-4 rounded cursor-pointer">
            </label>

            <!-- 穿界魔法金塵 -->
            <label class="flex items-center justify-between cursor-pointer text-xs py-1">
                <span class="text-stone-200 flex items-center gap-2">🪄 畫框穿界金塵粒子</span>

            <!-- 復古街燈開關 -->
            <label class="flex items-center justify-between cursor-pointer text-xs py-1">

                <input type="checkbox" id="toggle-lamps" checked class="accent-amber-500 w-4 h-4 rounded cursor-pointer">

            <!-- 導覽熱點標記開關 -->
            <label class="flex items-center justify-between cursor-pointer text-xs py-1">

        </div>

        <hr class="border-stone-700/60">

        <!-- 4. 畫中景深立體感滑桿 -->
        <div>
            <div class="flex justify-between text-xs mb-1">
                <span class="text-amber-300 font-medium">🎨 畫中世界立體景深</span>
                <span id="depth-val" class="text-stone-300">100%</span>
            </div>
            <input type="range" id="painting-depth-slider" min="20" max="150" value="100" class="w-full accent-amber-500 cursor-pointer h-1.5 bg-stone-700 rounded-lg">
        </div>
    </aside>

    <!-- 底部導覽解說卡片 -->
    <div id="info-card" class="fixed bottom-5 left-4 right-4 md:left-6 md:right-auto md:w-[26rem] z-20 glass-panel rounded-2xl p-4 transition-all duration-300 transform translate-y-0 opacity-100">
        <div class="flex items-start justify-between gap-2">
            <div>
                <span id="info-tag" class="text-[11px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                    焦點導覽
                </span>
                <h3 id="info-title" class="serif-title text-lg font-bold text-amber-100 mt-1.5">
                    跨越虛實的拱門古石橋
                </h3>
            </div>
            <button id="close-info-btn" class="text-stone-400 hover:text-white p-1 rounded-lg">
                ✕
            </button>
        </div>
        <p id="info-desc" class="text-xs text-stone-200/90 mt-2 leading-relaxed">
            這座多拱門中世紀鵝卵石古橋從巴洛克金框油畫的左下方直接破框而出，橋墩穩穩立於現代客廳的溫潤木地板上。橋面鋪設凹凸鵝卵石，兩側設有鑄鐵復古街燈與微型旅人，營造畫中世界與現實空間交融的超現實詩意。
        </p>
    </div>

    <script>
        window.onload = function () {
            // ==========================================
            // 1. 產生程序化材質貼圖 (Procedural Canvas Textures)
            // ==========================================
            
            // (A) 洞石牆面貼圖 (Travertine Limestone Wall)
            function createTravertineTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                // 基底米灰暖石色
                ctx.fillStyle = '#c8bca8';
                ctx.fillRect(0, 0, 1024, 1024);

                // 水平沉積岩層次紋理
                for (let y = 0; y < 1024; y += 2) {
                    const wave = Math.sin(y * 0.03) * 8 + (Math.random() - 0.5) * 10;
                    const shade = 190 + Math.floor(wave);
                    ctx.fillStyle = `rgb(${shade}, ${shade - 12}, ${shade - 28})`;
                    ctx.fillRect(0, y, 1024, 2);
                }

                // 洞石特有的天然水平孔隙 (Pores)
                for (let i = 0; i < 1800; i++) {
                    const x = Math.random() * 1024;
                    const y = Math.random() * 1024;
                    const w = 4 + Math.random() * 28;
                    const h = 1 + Math.random() * 3.5;
                    ctx.fillStyle = Math.random() > 0.3 ? 'rgba(75, 62, 48, 0.38)' : 'rgba(235, 228, 215, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 大理石磚分割縫隙
                ctx.strokeStyle = 'rgba(85, 72, 58, 0.45)';
                ctx.lineWidth = 2;
                const rows = 8;
                const cols = 4;
                const rowH = 1024 / rows;
                const colW = 1024 / cols;

                for (let r = 0; r <= rows; r++) {
                    ctx.beginPath();
                    ctx.moveTo(0, r * rowH);
                    ctx.lineTo(1024, r * rowH);
                    ctx.stroke();
                }
                for (let r = 0; r < rows; r++) {
                    const offset = (r % 2) * (colW / 2);
                    for (let c = 0; c <= cols; c++) {
                        const x = (c * colW + offset) % 1024;
                        ctx.beginPath();
                        ctx.moveTo(x, r * rowH);
                        ctx.lineTo(x, (r + 1) * rowH);
                        ctx.stroke();
                    }
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(2.5, 1.4);
                return tex;
            }

            // (B) 溫潤木地板貼圖 (Warm Wood Plank Flooring)
            function createWoodFloorTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#8d6239';
                ctx.fillRect(0, 0, 1024, 1024);

                const planks = 12;
                const plankH = 1024 / planks;

                for (let p = 0; p < planks; p++) {
                    const y = p * plankH;
                    const baseR = 135 + (Math.random() - 0.5) * 20;
                    const baseG = 92 + (Math.random() - 0.5) * 16;
                    const baseB = 52 + (Math.random() - 0.5) * 12;
                    ctx.fillStyle = `rgb(${baseR}, ${baseG}, ${baseB})`;
                    ctx.fillRect(0, y, 1024, plankH);

                    // 木紋纖維
                    for (let i = 0; i < 45; i++) {
                        ctx.strokeStyle = `rgba(60, 35, 15, ${0.06 + Math.random() * 0.08})`;
                        ctx.lineWidth = 1 + Math.random() * 2;
                        ctx.beginPath();
                        const wy = y + Math.random() * plankH;
                        ctx.moveTo(0, wy);
                        ctx.bezierCurveTo(340, wy + (Math.random() - 0.5) * 12, 680, wy + (Math.random() - 0.5) * 12, 1024, wy);
                        ctx.stroke();
                    }

                    // 地板接縫
                    ctx.strokeStyle = 'rgba(40, 22, 10, 0.65)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(1024, y);
                    ctx.stroke();

                    // 垂直短接縫
                    const splitX = ((p * 370) + 180) % 900 + 60;
                    ctx.beginPath();
                    ctx.moveTo(splitX, y);
                    ctx.lineTo(splitX, y + plankH);
                    ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(3, 3);
                return tex;
            }

            // (C) 波斯復古雕花地毯貼圖 (Ornate Vintage Rug)
            function createRugTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 768;
                const ctx = canvas.getContext('2d');

                // 米白復古底色
                ctx.fillStyle = '#dfd5c3';
                ctx.fillRect(0, 0, 1024, 768);

                // 外框與多層古典邊框
                const borders = [
                    { pad: 24, color: '#6b4c3b', width: 8 },
                    { pad: 44, color: '#9c7a54', width: 22 },
                    { pad: 70, color: '#4a3528', width: 5 },
                    { pad: 86, color: '#b59978', width: 14 }
                ];
                borders.forEach(b => {
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = b.width;
                    ctx.strokeRect(b.pad, b.pad, 1024 - b.pad * 2, 768 - b.pad * 2);
                });

                // 幾何古典圖騰與藤蔓對稱花紋
                ctx.save();
                ctx.translate(512, 384);
                for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 8) {
                    ctx.save();
                    ctx.rotate(angle);
                    ctx.fillStyle = 'rgba(105, 72, 52, 0.55)';
                    ctx.beginPath();
                    ctx.ellipse(0, 140, 22, 65, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(155, 115, 78, 0.5)';
                    ctx.beginPath();
                    ctx.arc(0, 210, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 中心徽章
                ctx.fillStyle = '#73513d';
                ctx.beginPath();
                ctx.arc(0, 0, 75, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#dfd5c3';
                ctx.beginPath();
                ctx.arc(0, 0, 48, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 散落古典花卉斑點模擬織紋
                for (let x = 110; x < 914; x += 48) {
                    for (let y = 110; y < 658; y += 48) {
                        ctx.fillStyle = ((x + y) % 96 === 0) ? 'rgba(95, 68, 50, 0.42)' : 'rgba(145, 112, 82, 0.35)';
                        ctx.beginPath();
                        ctx.arc(x, y, 8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 織物顆粒感
                for (let i = 0; i < 8000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(60,40,25,0.06)';
                    ctx.fillRect(Math.random() * 1024, Math.random() * 768, 2, 2);
                }

                return new THREE.CanvasTexture(canvas);
            }

            // (D) 古石橋砌石與鵝卵石貼圖 (Cobblestone & Masonry Texture)
            function createStoneBridgeTexture(isRoad = false) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = isRoad ? '#555049' : '#8a8275';
                ctx.fillRect(0, 0, 512, 512);

                const rows = isRoad ? 18 : 10;
                const cols = isRoad ? 14 : 6;
                const rh = 512 / rows;
                const cw = 512 / cols;

                for (let r = 0; r < rows; r++) {
                    const offset = (r % 2) * (cw * 0.5);
                    for (let c = -1; c <= cols; c++) {
                        const x = c * cw + offset + (Math.random() - 0.5) * 3;
                        const y = r * rh + (Math.random() - 0.5) * 2;
                        const tone = (isRoad ? 115 : 145) + (Math.random() - 0.5) * 38;
                        ctx.fillStyle = `rgb(${tone}, ${tone - 6}, ${tone - 14})`;

                        if (isRoad) {
                            // 圓潤立體鵝卵石
                            ctx.beginPath();
                            ctx.roundRect(x + 2, y + 2, cw - 4, rh - 4, 6);
                            ctx.fill();
                        } else {
                            // 橋身方形石塊
                            ctx.fillRect(x + 1.5, y + 1.5, cw - 3, rh - 3);
                        }
                    }
                }

                // 風化青苔與陰影斑駁感
                for (let i = 0; i < 1200; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(40, 38, 32, 0.14)' : 'rgba(210, 200, 185, 0.1)';
                    ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            // (E) 畫中壯麗夕陽雲彩與遠山背景貼圖 (Painting Sky & Distant Valley Backdrop)
            function createPaintingSkyTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 640;
                const ctx = canvas.getContext('2d');

                // 夕陽漸層天空
                const skyGrad = ctx.createLinearGradient(0, 0, 0, 420);
                skyGrad.addColorStop(0, '#3a4b5e');
                skyGrad.addColorStop(0.35, '#8c6f5a');
                skyGrad.addColorStop(0.7, '#dfa86b');
                skyGrad.addColorStop(1, '#f7d294');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, 1024, 640);

                // 夕陽雲彩層次
                for (let i = 0; i < 65; i++) {
                    const cx = Math.random() * 1024;
                    const cy = 30 + Math.random() * 230;
                    const rx = 50 + Math.random() * 130;
                    const ry = 12 + Math.random() * 32;
                    const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, rx);
                    grad.addColorStop(0, 'rgba(255, 210, 145, 0.35)');
                    grad.addColorStop(0.5, 'rgba(130, 95, 75, 0.25)');
                    grad.addColorStop(1, 'rgba(70, 60, 65, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 遠方霧氣山脈剪影
                ctx.fillStyle = '#6c686b';
                ctx.beginPath();
                ctx.moveTo(0, 420);
                const pts = [0, 310, 140, 250, 260, 140, 380, 290, 520, 330, 660, 230, 790, 280, 910, 170, 1024, 240];
                for (let i = 0; i < pts.length; i += 2) {
                    ctx.lineTo(pts[i], pts[i + 1]);
                }
                ctx.lineTo(1024, 640);
                ctx.lineTo(0, 640);
                ctx.fill();

                // 峽谷草坡底色與蜿蜒金色溪流
                const valleyGrad = ctx.createLinearGradient(0, 360, 0, 640);

                ctx.lineWidth = 28;
                ctx.lineCap = 'round';

                ctx.bezierCurveTo(490, 430, 630, 480, 550, 540);
                ctx.bezierCurveTo(500, 580, 620, 610, 650, 640);
                ctx.stroke();

                return new THREE.CanvasTexture(canvas);

            // ==========================================

            // ==========================================

            // ==========================================
            const paintingMasterGroup = new THREE.Group();

            const frameW = 9.4;

                color: 0x9c721c,
                metalness: 0.7,
                roughness: 0.38
            });

            const frameGroup = new THREE.Group();
            paintingMasterGroup.add(frameGroup);

            // 多層次古典巴洛克金框線條
            function createMoldingBar(length, isHorizontal, yOrXSign) {
                const barGroup = new THREE.Group();
                const outer = new THREE.Mesh(new THREE.BoxGeometry(isHorizontal ? length : 0.42, isHorizontal ? 0.42 : length, 0.28), goldMat);
                const inner = new THREE.Mesh(new THREE.BoxGeometry(isHorizontal ? length - 0.35 : 0.22, isHorizontal ? 0.22 : length - 0.35, 0.36), darkGoldMat);
                const bead = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, length, 16), goldMat);
                if (isHorizontal) bead.rotation.z = Math.PI / 2;
                bead.position.z = 0.14;
                barGroup.add(outer, inner, bead);

                // 巴洛克浮雕裝飾細節
                const count = Math.floor(length / 0.55);
                for (let i = -count / 2; i <= count / 2; i++) {
                    const ornament = new THREE.Mesh(new THREE.OctahedronGeometry(0.11, 1), goldMat);
                    ornament.scale.set(1.2, 0.7, 0.6);
                    if (isHorizontal) {
                        ornament.position.set(i * 0.5, yOrXSign * 0.06, 0.18);
                    } else {
                        ornament.position.set(yOrXSign * 0.06, i * 0.5, 0.18);
                    }
                    barGroup.add(ornament);
                }
                return barGroup;
            }

            const topFrame = createMoldingBar(frameW + 0.45, true, 1);
            topFrame.position.set(0, frameH / 2, 0.15);
            const bottomFrame = createMoldingBar(frameW + 0.45, true, -1);
            bottomFrame.position.set(0, -frameH / 2, 0.15);
            const leftFrame = createMoldingBar(frameH + 0.45, false, -1);
            leftFrame.position.set(-frameW / 2, 0, 0.15);
            const rightFrame = createMoldingBar(frameH + 0.45, false, 1);
            rightFrame.position.set(frameW / 2, 0, 0.15);
            frameGroup.add(topFrame, bottomFrame, leftFrame, rightFrame);

            // 四角與頂部中央華麗巴洛克雕花徽飾 (Corner & Crest Filigree)
            const cornerPositions = [
                [-frameW / 2, frameH / 2],
                [frameW / 2, frameH / 2],
                [-frameW / 2, -frameH / 2],
                [frameW / 2, -frameH / 2]
            ];
            cornerPositions.forEach(([cx, cy]) => {
                const rosette = new THREE.Mesh(new THREE.TorusKnotGeometry(0.22, 0.065, 48, 8, 2, 3), goldMat);
                rosette.position.set(cx, cy, 0.25);
                rosette.castShadow = true;
                frameGroup.add(rosette);
            });
            // 頂部中央皇冠雕花
            const topCrest = new THREE.Mesh(new THREE.TorusKnotGeometry(0.26, 0.06, 64, 8, 3, 4), goldMat);
            topCrest.scale.set(2.2, 0.85, 0.5);
            topCrest.position.set(0, frameH / 2 + 0.08, 0.26);
            frameGroup.add(topCrest);

            // --- 畫中立體微縮世界 (3D Diorama Inside Painting) ---
            const dioramaGroup = new THREE.Group();
            paintingMasterGroup.add(dioramaGroup);

            // 畫布天空與遠景底圖
            const skyBackdrop = new THREE.Mesh(
                new THREE.PlaneGeometry(frameW - 0.3, frameH - 0.3),
                new THREE.MeshBasicMaterial({ map: paintingSkyTex })
            );
            skyBackdrop.position.set(0, 0, -1.5);
            dioramaGroup.add(skyBackdrop);

            // 畫框內側遮罩盒 (深邃立體畫盒)
            const boxWallMat = new THREE.MeshBasicMaterial({ color: 0x241d17, side: THREE.BackSide });
            const shadowBox = new THREE.Mesh(new THREE.BoxGeometry(frameW - 0.3, frameH - 0.3, 1.6), boxWallMat);
            shadowBox.position.set(0, 0, -0.75);
            dioramaGroup.add(shadowBox);

            // 畫中 3D 崇山峻嶺 (左側與右側陡峭山峰)
            const mountainMatLeft = new THREE.MeshStandardMaterial({ color: 0x5c5349, roughness: 0.88, flatShading: true });
            const mountainMatRight = new THREE.MeshStandardMaterial({ color: 0x453d36, roughness: 0.9, flatShading: true });

            const peaksData = [
                { x: -2.2, y: 0.55, z: -1.15, r: 1.45, h: 3.1, mat: mountainMatLeft },
                { x: -3.3, y: 0.25, z: -1.0, r: 1.3, h: 2.6, mat: mountainMatLeft },

                { x: 3.5, y: 0.4, z: -1.05, r: 1.35, h: 2.9, mat: mountainMatRight },
                { x: 2.5, y: -0.1, z: -1.2, r: 1.1, h: 2.1, mat: mountainMatRight }
            ];
            peaksData.forEach(p => {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(p.r, p.h, 7), p.mat);
                cone.position.set(p.x, p.y, p.z);
                cone.rotation.y = Math.random() * Math.PI;

            });

            // 畫中左右兩側山坡與針葉松林
            const cliffLeft = new THREE.Mesh(new THREE.DodecahedronGeometry(1.75, 1), new THREE.MeshStandardMaterial({ color: 0x3b4429, roughness: 0.9, flatShading: true }));
            cliffLeft.scale.set(1.3, 0.85, 0.6);
            cliffLeft.position.set(-2.9, -1.65, -0.55);
            dioramaGroup.add(cliffLeft);

            const cliffRight = new THREE.Mesh(new THREE.DodecahedronGeometry(1.65, 1), new THREE.MeshStandardMaterial({ color: 0x343d23, roughness: 0.9, flatShading: true }));
            cliffRight.scale.set(1.25, 0.9, 0.6);
            cliffRight.position.set(2.9, -1.7, -0.55);
            dioramaGroup.add(cliffRight);

            // 畫中松樹群函式
            function createPineTree(scale = 1) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.03 * scale, 0.05 * scale, 0.35 * scale, 6),

                    );
                    layer.position.y = (0.32 + i * 0.2) * scale;
                    tree.add(layer);
                }
                return tree;
            }

            const treeCoords = [
                [-3.9, -1.1, -0.35, 1.8], [-3.5, -1.2, -0.4, 2.1], [-2.9, -1.3, -0.45, 1.4],

            treeCoords.forEach(([tx, ty, tz, ts]) => {

                pine.position.set(tx, ty, tz);
                dioramaGroup.add(pine);

            // 畫中橫跨峽谷的壯麗三拱巨石橋 (Grand Arch Bridge inside Painting)
            const innerBridgeGroup = new THREE.Group();
            const innerStoneMat = new THREE.MeshStandardMaterial({

            });

            const rightPier = new THREE.Mesh(new THREE.BoxGeometry(0.62, 2.35, 0.45), innerStoneMat);
            rightPier.position.set(1.75, -1.05, -0.55);

            // 中央巨型圓拱與左右副拱
            const centerArch = new THREE.Mesh(

            centerArch.position.set(0.1, -0.95, -0.32);
            innerBridgeGroup.add(centerArch);

            // 畫中拱頂石徽章 (Keystone)
            const keystone = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.34, 0.52), innerStoneMat);
            keystone.position.set(0.1, 0.65, -0.52);

            // 畫中上層拱橋弧形橋面
            const archRoadCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-3.6, -0.18, -0.6),
                new THREE.Vector3(-1.55, 0.25, -0.55),
                new THREE.Vector3(0.1, 0.72, -0.52),
                new THREE.Vector3(1.75, 0.25, -0.55),
                new THREE.Vector3(3.9, -0.22, -0.6)
            ]);
            const archDeckGeo = new THREE.TubeGeometry(archRoadCurve, 36, 0.22, 8, false);
            const archDeck = new THREE.Mesh(archDeckGeo, innerStoneMat);
            archDeck.scale.set(1, 0.65, 1.3);
            innerBridgeGroup.add(archDeck);

            dioramaGroup.add(innerBridgeGroup);

            // 畫中山谷漂浮雲霧層 (Animated Mountain Mist)
            const mistPlanes = [];
            for (let i = 0; i < 6; i++) {
                const mistMat = new THREE.MeshBasicMaterial({
                    color: 0xffe8cc,
                    transparent: true,
                    opacity: 0.18,
                    depthWrite: false
                });
                const mist = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.65), mistMat);
                mist.position.set(-2.5 + i * 0.95, -0.2 + (i % 2) * 0.35, -0.85);
                mist.userData = { baseX: mist.position.x, speed: 0.35 + i * 0.1, phase: i };
                dioramaGroup.add(mist);
                mistPlanes.push(mist);
            }

            registerInteractable(paintingMasterGroup, 'painting');

            // ==========================================
            // 5. 從畫中延伸至客廳的 3D 古石橋 (The Surreal 3D Stone Bridge)
            // ==========================================
            const bridgeMasterGroup = new THREE.Group();
            scene.add(bridgeMasterGroup);

            // 定義古石橋從畫框內側一路延伸至左下角前景的控制路徑
            // 起點位於畫中右下河谷，穿出畫框底部偏左處，斜向延伸至客廳左下前景
            const bridgeStart = new THREE.Vector3(0.25, 2.15, -3.35); // 畫框內側引橋起點
            const bridgePortal = new THREE.Vector3(-0.65, 2.02, -2.75); // 穿出畫框交界點
            const bridgeEnd = new THREE.Vector3(-5.85, 0.92, 6.2);      // 客廳左下角前景終點

            const bridgeCurve = new THREE.CatmullRomCurve3([
                bridgeStart,
                bridgePortal,
                new THREE.Vector3(-2.1, 1.72, -0.1),
                new THREE.Vector3(-3.8, 1.35, 2.8),
                bridgeEnd
            ]);

            const bridgeStoneMat = new THREE.MeshStandardMaterial({
                map: stoneWallTex,
                roughness: 0.85,
                bumpMap: stoneWallTex,
                bumpScale: 0.04
            });
            const darkStoneMat = new THREE.MeshStandardMaterial({
                map: stoneWallTex,
                color: 0x736b5e,
                roughness: 0.88
            });
            const roadCobbleMat = new THREE.MeshStandardMaterial({
                map: cobbleRoadTex,
                roughness: 0.8,
                bumpMap: cobbleRoadTex,
                bumpScale: 0.05
            });

            // 沿著橋樑路徑分段建構：鵝卵石橋面、兩側石砌護欄、底部拱門與落於木地板上的石橋墩
            const totalSegments = 48;
            const bridgeWidth = 1.48;
            const parapetH = 0.24;
            const parapetW = 0.15;

            for (let i = 0; i < totalSegments; i++) {
                const t1 = i / totalSegments;
                const t2 = (i + 1) / totalSegments;
                const tm = (t1 + t2) / 2;

                const p1 = bridgeCurve.getPoint(t1);
                const p2 = bridgeCurve.getPoint(t2);
                const pm = bridgeCurve.getPoint(tm);
                const segLen = p1.distanceTo(p2) * 1.06;

                // 計算切線方向與水平法向量
                const tangent = p2.clone().sub(p1).normalize();
                const up = new THREE.Vector3(0, 1, 0);
                const right = new THREE.Vector3().crossVectors(tangent, up).normalize();

                const segGroup = new THREE.Group();
                segGroup.position.copy(pm);
                // 讓分段朝向切線方向
                const lookTarget = pm.clone().add(tangent);
                segGroup.lookAt(lookTarget);

                // 1. 鵝卵石橋面 (Cobblestone Deck)
                const roadDeck = new THREE.Mesh(
                    new THREE.BoxGeometry(bridgeWidth - parapetW * 1.4, 0.14, segLen),
                    roadCobbleMat
                );
                roadDeck.castShadow = true;
                roadDeck.receiveShadow = true;
                segGroup.add(roadDeck);

                // 2. 左右兩側人行步階與石砌矮牆護欄 (Stone Parapets)
                [-1, 1].forEach(side => {
                    // 內側微凸路緣石
                    const curb = new THREE.Mesh(
                        new THREE.BoxGeometry(0.18, 0.18, segLen),
                        darkStoneMat
                    );
                    curb.position.set(side * (bridgeWidth / 2 - 0.16), 0.03, 0);
                    segGroup.add(curb);

                    // 外側石砌護欄牆与壓頂石
                    const wall = new THREE.Mesh(
                        new THREE.BoxGeometry(parapetW, parapetH, segLen),
                        bridgeStoneMat
                    );
                    wall.position.set(side * (bridgeWidth / 2), parapetH / 2 + 0.02, 0);
                    wall.castShadow = true;
                    wall.receiveShadow = true;
                    segGroup.add(wall);

                    const coping = new THREE.Mesh(
                        new THREE.BoxGeometry(parapetW + 0.05, 0.05, segLen + 0.01),
                        darkStoneMat
                    );
                    coping.position.set(side * (bridgeWidth / 2), parapetH + 0.05, 0);

            renderer.domElement.addEventListener('pointerdown', (e) => {
                pointerDownPos.x = e.clientX;
                pointerDownPos.y = e.clientY;
            });

            renderer.domElement.addEventListener('pointerup', (e) => {
                const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (moveDist > 6) return; // 排除拖曳旋轉視角

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                const intersects = raycaster.intersectObjects(interactableObjects, false);
                if (intersects.length > 0) {
                    const key = intersects[0].object.userData.infoKey;
                    if (key) showInfoCard(key);
                }
            });

            // ==========================================
            // 10. 鏡頭預設視角平滑運鏡與 UI 事件綁定
            // ==========================================
            const cameraPresets = {
                photo: {
                    pos: new THREE.Vector3(-1.3, 1.85, 11.2),
                    target: new THREE.Vector3(-0.3, 1.6, 0.5),
                    info: 'bridge'
                },
                bridge: {
                    pos: new THREE.Vector3(-5.1, 1.75, 5.2),
                    target: new THREE.Vector3(-0.5, 2.8, -2.5),
                    info: 'bridge'
                },
                painting: {
                    pos: new THREE.Vector3(-0.3, 4.1, 3.2),
                    target: new THREE.Vector3(-0.2, 4.3, -3.2),
                    info: 'painting'
                },
                room: {
                    pos: new THREE.Vector3(6.8, 5.2, 10.8),
                    target: new THREE.Vector3(-0.8, 2.0, 0.2),
                    info: 'table'
                }
            };

            let activeCameraTween = null;

            function moveToCameraPreset(presetKey) {
                const preset = cameraPresets[presetKey];
                if (!preset) return;

                activeCameraTween = {
                    startPos: camera.position.clone(),
                    endPos: preset.pos.clone(),
                    startTarget: controls.target.clone(),
                    endTarget: preset.target.clone(),
                    progress: 0
                };
                showInfoCard(preset.info);
            }

            // 當使用者手動拖曳時取消自動運鏡
            controls.addEventListener('start', () => {
                activeCameraTween = null;
            });

            // 綁定視角按鈕
            document.querySelectorAll('.cam-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    moveToCameraPreset(btn.dataset.cam);
                });
            });

            // 綁定光影時辰按鈕
            document.querySelectorAll('.light-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.light-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    applyLightingMode(btn.dataset.light);
                });
            });

            // 綁定開關與滑桿
            let isAnimEnabled = true;
            document.getElementById('toggle-anim').addEventListener('change', (e) => {
                isAnimEnabled = e.target.checked;
            });

            document.getElementById('toggle-particles').addEventListener('change', (e) => {
                portalParticles.visible = e.target.checked;
            });

            document.getElementById('toggle-lamps').addEventListener('change', (e) => {
                const on = e.target.checked;
                streetLampLights.forEach(l => l.visible = on);
                lampBulbs.forEach(b => b.material.color.setHex(on ? 0xffdf85 : 0x555555));
            });

            document.getElementById('toggle-hotspots').addEventListener('change', (e) => {
                hotspotsLayer.style.display = e.target.checked ? 'block' : 'none';
            });

            document.getElementById('painting-depth-slider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value, 10);
                document.getElementById('depth-val').textContent = `${val}%`;
                dioramaGroup.scale.z = val / 100;
            });

            // 收合/展開控制面板
            const controlPanel = document.getElementById('control-panel');
            const toggleUiBtn = document.getElementById('toggle-ui-btn');
            const toggleUiText = document.getElementById('toggle-ui-text');
            let panelOpen = true;

            toggleUiBtn.addEventListener('click', () => {
                panelOpen = !panelOpen;
                if (panelOpen) {
                    controlPanel.classList.remove('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
                    toggleUiText.textContent = '收合控制面板';
                } else {
                    controlPanel.classList.add('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
                    toggleUiText.textContent = '展開控制面板';
                }
            });

            // 視窗尺寸自適應
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // ==========================================
            // 11. 動畫主迴圈 (Animation Loop)
            // ==========================================
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                // 限制最大 delta 值，避免切換分頁或延遲時產生過大的時間步長導致曲線參數越界
                const delta = Math.min(clock.getDelta(), 0.1);
                const elapsed = clock.getElapsedTime();

                // 1. 處理平滑鏡頭過渡
                if (activeCameraTween) {
                    activeCameraTween.progress += delta * 1.35;
                    const t = Math.min(activeCameraTween.progress, 1);
                    // Smoothstep 緩動曲線
                    const ease = t * t * (3 - 2 * t);

                    camera.position.lerpVectors(activeCameraTween.startPos, activeCameraTween.endPos, ease);
                    controls.target.lerpVectors(activeCameraTween.startTarget, activeCameraTween.endTarget, ease);

                    if (t >= 1) activeCameraTween = null;
                }

                controls.update();

                // 2. 更新橋上旅人漫步動畫與山谷雲霧
                if (isAnimEnabled) {
                    travelers.forEach((tr, idx) => {
                        tr.t += tr.dir * tr.speed * delta;
                        if (tr.t >= 0.94) {
                            tr.t = 0.94;
                            tr.dir = -1;
                        } else if (tr.t <= 0.08) {
                            tr.t = 0.08;
                            tr.dir = 1;
                        }

                        // 確保曲線參數嚴格限制於 [0, 1] 區間內
                        const safeT = THREE.MathUtils.clamp(tr.t, 0.08, 0.94);
                        const pt = bridgeCurve.getPoint(safeT);
                        const tan = bridgeCurve.getTangent(safeT).normalize();
                        const right = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0, 1, 0)).normalize();

                        tr.mesh.position.copy(pt).addScaledVector(right, tr.lane);
                        // 輕微步行上下律動
                        tr.mesh.position.y += 0.07 + Math.abs(Math.sin(elapsed * 7 + idx)) * 0.015;

                        const lookDir = tan.clone().multiplyScalar(tr.dir);
                        tr.mesh.lookAt(tr.mesh.position.clone().add(lookDir));
                    });

                    // 畫中山谷雲霧緩慢漂浮
                    mistPlanes.forEach(mist => {
                        mist.position.x = mist.userData.baseX + Math.sin(elapsed * mist.userData.speed + mist.userData.phase) * 0.45;
                    });
                }

                // 3. 更新穿界金塵粒子漂浮
                if (portalParticles.visible) {
                    const posAttr = portalParticles.geometry.attributes.position;
                    for (let i = 0; i < particleCount; i++) {
                        let py = posAttr.getY(i);
                        py += delta * 0.18;
                        if (py > 4.2) py = 1.0;
                        posAttr.setY(i, py);
                    }
                    posAttr.needsUpdate = true;
                }

                // 4. 更新 3D 導覽熱點螢幕座標投影
                hotspotElements.forEach(h => {
                    const projected = h.pos.clone().project(camera);
                    // 檢查是否在相機前方
                    if (projected.z < 1) {
                        const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                        const y = (-(projected.y * 0.5) + 0.5) * window.innerHeight;
                        h.el.style.transform = `translate(${x}px, ${y}px)`;
                        h.el.style.left = '0px';
                        h.el.style.top = '0px';
                        h.el.style.display = 'flex';
                    } else {
                        h.el.style.display = 'none';
                    }
                });

                renderer.render(scene, camera);
            }

            animate();
        };
    </script>
</body>
</html>
